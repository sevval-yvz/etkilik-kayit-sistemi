<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Kayıt Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'event_list' %}">Etkinlik Portalı</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a href="{% url 'my_registrations' %}" class="btn btn-outline-light btn-sm me-2">Etkinliklerim</a>
                    <span class="text-light me-3">Merhaba, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Çıkış Yap</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Giriş Yap</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Kayıt Ol</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{message}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
